name: Release validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: bash scripts/bootstrap.sh
      - run: bash scripts/test.sh
      - name: Stage development bundle only
        run: INIGO_STAGE_ONLY=1 bash scripts/build.sh
      - name: Reminder
        run: echo 'No public artifact is published. Use scripts/release.sh with Developer ID, notarization and Sparkle signing keys.'
