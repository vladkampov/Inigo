name: Release validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: bash scripts/bootstrap.sh
      - run: bash scripts/test.sh
      - name: Stage development bundle only
        run: INIGO_STAGE_ONLY=1 bash scripts/build.sh
      - name: Reminder
        run: echo 'No public artifact is published. Use scripts/release.sh with Developer ID, notarization and Sparkle signing keys.'
