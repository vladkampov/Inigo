name: Publish update feed
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Published release channel to verify
        type: choice
        options: [beta, stable]
        default: beta
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: update-feed
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Verify published release and publish isolated feed
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ github.event_name == 'release' && (github.event.release.prerelease && 'beta' || 'stable') || inputs.channel }}
        run: python3 scripts/prepare-beta-feed.py --channel "$CHANNEL" --publish
