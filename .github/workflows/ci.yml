name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install optional bridge test dependencies
        run: npm ci --prefix CloudBridge --ignore-scripts
      - name: Validate version and test
        run: |
          python3 scripts/version.py
          bash scripts/test.sh
      - name: Check repository hygiene
        run: python3 scripts/check-publication.py
